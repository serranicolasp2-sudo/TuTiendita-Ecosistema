# tutiendita-ia.store: server block PROPIO. No modifica los del Campus, la tienda ni la web del CFP.
# Copiar a /etc/nginx/sites-available/tutiendita-ia y enlazar en sites-enabled (ver docs/DESPLIEGUE.md).
# El certificado se saca ANTES de instalar este archivo (si no, nginx -t falla):
#   sudo certbot certonly --nginx -d tutiendita-ia.store -d www.tutiendita-ia.store

upstream tutiendita_ia {
    server unix:/run/tutiendita-ia/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name tutiendita-ia.store www.tutiendita-ia.store;
    return 301 https://tutiendita-ia.store$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tutiendita-ia.store;
    ssl_certificate     /etc/letsencrypt/live/tutiendita-ia.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tutiendita-ia.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://tutiendita-ia.store$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tutiendita-ia.store;
    ssl_certificate     /etc/letsencrypt/live/tutiendita-ia.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tutiendita-ia.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/tutiendita-ia.access.log;
    error_log  /var/log/nginx/tutiendita-ia.error.log;
    client_max_body_size 5m;            # Etapa 1: el sitio no recibe archivos

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS lo manda Django (SECURE_HSTS_SECONDS en /etc/tutiendita-ia/env): así no sale duplicado.

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/rss+xml application/xml;

    # Estáticos con hash en el nombre (ManifestStaticFilesStorage): se pueden guardar un año.
    location /static/ {
        alias /srv/tutiendita-ia/actual/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location / {
        proxy_pass http://tutiendita_ia;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
